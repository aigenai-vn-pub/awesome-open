name: Inclusion gate audit

# Weekly audit: verify every repo in data.yaml still passes the inclusion gate
# (> min_stars AND pushed within max_age_days). A failing run flags repos that
# have dipped below the bar so a maintainer can prune or refresh them.
#
# This runs on a schedule (not on PRs) on purpose: a listed repo going stale is
# not a contributor's fault and should not block unrelated pull requests.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Audit inclusion gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_gate.py --fail-on-violation

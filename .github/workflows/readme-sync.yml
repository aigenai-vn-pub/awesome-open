name: README sync check

# Fails if README.md tables have drifted out of sync with data.yaml.
# Contributors edit data.yaml and run scripts/generate_readme.py to regenerate.

on:
  pull_request:
    paths:
      - "data.yaml"
      - "README.md"
      - "scripts/**"
      - ".github/workflows/readme-sync.yml"
  push:
    branches: [main]
    paths:
      - "data.yaml"
      - "README.md"
      - "scripts/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify README is generated from data.yaml
        run: python3 scripts/generate_readme.py --check
